name: patch release (reusable)

on:
  workflow_call:
    inputs:
      dry-run:
        description: Dry run
        type: boolean
        required: true
      commit-version-bump:
        description: Push the version bump commit back to main
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          registry-url: https://registry.npmjs.org/

      - name: Resolve next patch version
        id: version
        run: |
          LATEST=$(npm view @swmansion/t-rex-ui version)
          NEXT=$(node -e "const [a, b, c] = '$LATEST'.split('.').map(Number); console.log([a, b, c + 1].join('.'))")
          echo "Latest published: $LATEST, releasing: $NEXT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Publish package
        uses: software-mansion/npm-package-publish@bbfbcdf3f27e2dc288d7d56f5989a731efc79e6f
        with:
          package-name: '@swmansion/t-rex-ui'
          package-json-path: packages/t-rex-ui/package.json
          install-dependencies-command: yarn install --immutable
          release-type: stable
          version: ${{ steps.version.outputs.version }}
          dry-run: ${{ inputs.dry-run }}

      - name: Commit version bump to main
        if: inputs.commit-version-bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- packages/t-rex-ui/package.json; then
            echo "No version change to commit"
            exit 0
          fi
          git add packages/t-rex-ui/package.json
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
